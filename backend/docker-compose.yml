version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: og_user
      POSTGRES_PASSWORD: og_pass
      POSTGRES_DB: opportunitygenie
    ports:
      - "5432:5432"
    volumes:
      - og_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U og_user -d opportunitygenie"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://og_user:og_pass@db:5432/opportunitygenie
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  og_pgdata:
